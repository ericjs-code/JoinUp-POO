676.2305">SenhasPbkdf2 implementa VerificadorSenha; AutenticacaoTemplate recebe esse contrato.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="679.2871" x="17" y="692.3291">Os reposit&#243;rios herdam UsuarioRepositoryJdbc (implements UsuarioRepository); cadastro recebe a interface.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="485.6387" x="17" y="708.4277">Bola no fornecedor + encaixe no consumidor = conex&#227;o de contrato Java real.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="612.4521" x="17" y="724.5264">Os componentes representam responsabilidades internas, n&#227;o processos implant&#225;veis separados.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="541.584" x="17" y="740.625">HTTP/navegador, demais &#225;reas, JDBC e ACOP-01 est&#227;o na vista de contexto ANEXO.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="590.6455" x="17" y="756.7236">Chamadas sem interface continuam depend&#234;ncias concretas; nenhum socket fict&#237;cio foi criado.</text><!--SRC=[TLJDRXD94BxxAKev4H53-1LAMAJW1Q4Si4K2McczXt9FsTDoJ_NGtMC228c7u0KG1wILzfH7c3VXIVXwF8aTmbvcfgjwllhggvzaanCwzbPVryF9U4m_Fd-XaQzghw99uW5PlCASZKIQ-w1YRC6HX8AyRIHqXzjKiLLwjC_t7fhxWxYqMdFWYcB9XNzdTK5pTb6sF3CsoqNmZHOZxtoWTwLDstvpGU4alGV1fd9tjxo5pBbnwRdNz98heQDWsVtUVs8_2DrvjELKNqYKckxlRna3wp8R7puO95zJyZJpANb0sI0cMQ-3USYXTbw9yI49QMESSEW4gzhped4-aclF5zRWe_1KIQpmzDgUEml0Orxn3dqSq2OvsZaHBJbEPijYVdU7e6Ni3FJuyLfiUVBawWz7JSBR6cw_jz_yL2_FXlsfLBNZ91qGDwa4pBfClwAyajf7czhpO3DP21oRzci-J7N20NYsPXI-l-V3- -DYPgOw3WjM-m5L3R-wJfewwtBLt349sVJ_6OqOFPG2ShduUXqR1fTH40PGXs5wrzMCUh66-xl3TRu7z0OzEOSSODXfEzLLRmatkkjxX5_AtGCKsAE02fWrmGxbCiu1zIms2Kqribi1P-HLrqsnTt4BUCxh0c0TZ-7VfIqAqN_G_hf1tQ9yzKB7OF1fu6GXMlIzXzlRxK4MrPKAcl6rB0_fTtq0M2Cp8ObHeBYc03rl0NRS5-Mo0qe91QRWMigvXdJZCd2yVcFtSADP7uutEoC7U-eTO-